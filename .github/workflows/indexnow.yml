name: IndexNow submit

# After each push to main, build the site, then tell IndexNow (Bing, Yandex and
# others) about the URLs whose sitemap <lastmod> is yesterday, today or tomorrow
# in UTC. The wide window covers the owner's local time zone (Pakistan, UTC+5),
# where a page dated "tomorrow" relative to the runner's UTC date would otherwise
# be skipped. We read the freshly built out/sitemap.xml instead of fetching the
# live one, because Cloudflare blocks data-center requests with Python's default
# user agent. Selection logic lives in scripts/indexnow-urls.mjs (unit-tested).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # Only out/sitemap.xml is used; no real secrets needed.
        run: npm run build

      - name: Compute changed files
        # For a push, list files changed since the previous head. For a manual
        # run (workflow_dispatch) leave it empty, so an empty URL list is fine.
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$SHA" > changed.txt
          else
            : > changed.txt
          fi
          echo "Changed files:"
          cat changed.txt

      - name: Wait for Cloudflare Pages deploy
        run: sleep 120

      - name: Submit changed URLs to IndexNow
        env:
          INDEXNOW_KEY: "611bb630766bb7917bbbb5320facaa3c"
        run: node scripts/indexnow-urls.mjs
